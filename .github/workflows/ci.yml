# CI skeleton for talk-to-my-portfolio.
#
# Runs on every PR + push to main. The `lint` step from the plan was intentionally
# omitted in Task 0.6 because ESLint configs are not yet present in each package
# (they would force CI to red on the very first run). Add `- run: pnpm lint` once
# Phase 1+ adds per-package ESLint configs.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        # No `version` here: pnpm/action-setup@v4 reads the version from
        # package.json's `packageManager` field (pnpm@9.12.0). Specifying
        # both fails with ERR_PNPM_BAD_PM_VERSION.
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build runs first so dependent packages (@neryc/portfolio-shared,
      # @neryc/portfolio-mcp) produce dist/ output before downstream
      # workspace projects typecheck against their published entry points
      # (package.json `exports` → ./dist/...). Without this, sync-platzi
      # and apps/web fail with TS2307 in a fresh CI checkout.
      - name: Build
        run: pnpm build

      - name: Type check
        run: pnpm typecheck

      # Required check: @critical tests cover sampling, elicitation, and
      # capability negotiation. A regression here breaks the MCP contract,
      # so we run them BEFORE the full suite — failure mode is "critical
      # tests failed, the rest didn't run." See packages/mcp-server/README.md.
      - name: Critical tests (sampling/elicitation/capabilities)
        run: pnpm test:critical

      - name: Test
        run: pnpm test
